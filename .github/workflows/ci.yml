# Flasher's GUI is tested headless (no window, GPU or drive: libgui's CPU
# renderer and libflasher's file-backed mock drives) on all three platforms.
# The disk backends themselves are tested in libflasher's CI.
#
# Pushes and pull requests build the libflasher commit pinned in Cargo.toml.
# The weekly run (and a manual one) builds against libflasher's main branch
# instead, to catch library changes that would break the app before the pin
# is moved to them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, libflasher ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || 'pinned' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.lock pins libflasher
        shell: bash
        run: scripts/check-lock.sh
      - name: use libflasher main instead of the pin
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/developer180527/libflasher ../libflasher
          cp .cargo/config.toml.example .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: snapshots
        # The headless GUI tests render screenshots; keep them for review.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: target/snapshots/
          if-no-files-found: ignore
